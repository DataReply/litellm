name: Deploy Data Reply Instance

on:
  push:
    branches:
      - datareply/prod
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

defaults:
  run:
    shell: bash
    working-directory: ./terraform/litellm/aws/

env:
  AWS_REGION: eu-central-1
  IMAGE_TAG: ${{ github.sha }}

jobs:
  terraform:
    name: Terraform Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          audience: sts.amazonaws.com
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-oidc-provider-role
          role-session-name: github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.15.7"

      - name: Detect image-related changes
        id: image_changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base_ref="$BEFORE_SHA"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            base_ref="HEAD^"
          else
            base_ref=""
          fi

          if [ -z "$base_ref" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$base_ref"...HEAD -- \
            .dockerignore \
            gateway/ \
            backend/ \
            migrations/ \
            ui/ \
            litellm/ \
            litellm-proxy-extras/ \
            enterprise/ \
            pyproject.toml \
            uv.lock \
            schema.prisma; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform Init
        run: terraform init -backend-config=config/prod/backend.tfbackend

      - name: Terraform Validate
        run: terraform validate

      - name: Bootstrap ECR repositories
        run: |
          terraform apply -auto-approve \
            -var-file=config/prod/terraform.tfvars \
            -target=aws_ecr_repository.gateway \
            -target=aws_ecr_repository.backend \
            -target=aws_ecr_repository.ui \
            -target=aws_ecr_repository.migrations

      - name: Read ECR repository URLs
        id: ecr
        run: |
          {
            echo "gateway_repo=$(terraform output -raw gateway_ecr_repository_url)"
            echo "backend_repo=$(terraform output -raw backend_ecr_repository_url)"
            echo "ui_repo=$(terraform output -raw ui_ecr_repository_url)"
            echo "migrations_repo=$(terraform output -raw migrations_ecr_repository_url)"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve ECS image refs
        id: image_refs
        env:
          SOURCE_CHANGED: ${{ steps.image_changes.outputs.changed }}
          GATEWAY_CANDIDATE: ${{ steps.ecr.outputs.gateway_repo }}:${{ env.IMAGE_TAG }}
          BACKEND_CANDIDATE: ${{ steps.ecr.outputs.backend_repo }}:${{ env.IMAGE_TAG }}
          UI_CANDIDATE: ${{ steps.ecr.outputs.ui_repo }}:${{ env.IMAGE_TAG }}
          MIGRATIONS_CANDIDATE: ${{ steps.ecr.outputs.migrations_repo }}:${{ env.IMAGE_TAG }}
        run: |
          if [ "$SOURCE_CHANGED" = "true" ]; then
            {
              echo "build=true"
              echo "gateway_image=$GATEWAY_CANDIDATE"
              echo "backend_image=$BACKEND_CANDIDATE"
              echo "ui_image=$UI_CANDIDATE"
              echo "migrations_image=$MIGRATIONS_CANDIDATE"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          state_json="$RUNNER_TEMP/terraform-state.json"
          terraform show -json > "$state_json"

          image_for() {
            jq -r --arg name "$1" '
              def resources(module):
                (module.resources // [])[],
                ((module.child_modules // [])[] | resources(.));

              [
                resources(.values.root_module)
                | select(.type == "aws_ecs_task_definition" and .name == $name)
              ][0].values.container_definitions
              | fromjson
              | .[0].image // ""
            ' "$state_json"
          }

          gateway_image="$(image_for gateway)"
          backend_image="$(image_for backend)"
          ui_image="$(image_for ui)"
          migrations_image="$(image_for migrations)"

          if [ -n "$gateway_image" ] && [ -n "$backend_image" ] && [ -n "$ui_image" ] && [ -n "$migrations_image" ]; then
            build=false
          else
            build=true
            gateway_image="$GATEWAY_CANDIDATE"
            backend_image="$BACKEND_CANDIDATE"
            ui_image="$UI_CANDIDATE"
            migrations_image="$MIGRATIONS_CANDIDATE"
          fi

          {
            echo "build=$build"
            echo "gateway_image=$gateway_image"
            echo "backend_image=$backend_image"
            echo "ui_image=$ui_image"
            echo "migrations_image=$migrations_image"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.image_refs.outputs.build == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Amazon ECR
        if: steps.image_refs.outputs.build == 'true'
        uses: aws-actions/amazon-ecr-login@4625ce35226a7557230889aae2f52eb50ec3dcda # v2.0.1

      - name: Build and push gateway image
        if: steps.image_refs.outputs.build == 'true'
        uses: docker/build-push-action@0adf9959216b96bec444f325f1e493d4aa344497 # v6.14.0
        with:
          context: .
          file: ./gateway/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.gateway_repo }}:${{ env.IMAGE_TAG }}

      - name: Build and push backend image
        if: steps.image_refs.outputs.build == 'true'
        uses: docker/build-push-action@0adf9959216b96bec444f325f1e493d4aa344497 # v6.14.0
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.backend_repo }}:${{ env.IMAGE_TAG }}

      - name: Build and push UI image
        if: steps.image_refs.outputs.build == 'true'
        uses: docker/build-push-action@0adf9959216b96bec444f325f1e493d4aa344497 # v6.14.0
        with:
          context: .
          file: ./ui/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.ui_repo }}:${{ env.IMAGE_TAG }}

      - name: Build and push migrations image
        if: steps.image_refs.outputs.build == 'true'
        uses: docker/build-push-action@0adf9959216b96bec444f325f1e493d4aa344497 # v6.14.0
        with:
          context: .
          file: ./migrations/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.migrations_repo }}:${{ env.IMAGE_TAG }}

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file=config/prod/terraform.tfvars \
            -var="gateway_image=${{ steps.image_refs.outputs.gateway_image }}" \
            -var="backend_image=${{ steps.image_refs.outputs.backend_image }}" \
            -var="ui_image=${{ steps.image_refs.outputs.ui_image }}" \
            -var="migrations_image=${{ steps.image_refs.outputs.migrations_image }}" \
            -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/datareply/prod'
        run: terraform apply -auto-approve tfplan
